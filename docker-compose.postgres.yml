services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: portaldots_rebuild
      POSTGRES_USER: portaldots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portaldots -d portaldots_rebuild"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - portaldots-postgres-data:/var/lib/postgresql
      - ./backend/db/migrations:/migrations:ro

volumes:
  portaldots-postgres-data:
