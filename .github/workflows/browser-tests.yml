name: Frontend Browser Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-e2e:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install JS dependencies
        run: mise run frontend:install

      - name: Prepare local dev configuration
        run: |
          cp .env.example .env
          cp packages/email/.dev.vars.example packages/email/.dev.vars

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @portaldots/frontend exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @portaldots/frontend exec playwright install-deps chromium

      - name: Generate API client
        run: mise run api:client:codegen

      - name: Build (generates typed-router.d.ts)
        run: pnpm --filter @portaldots/frontend run build

      - name: Test e2e
        run: mise run e2e:worker

  frontend-storybook:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-storybook')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install JS dependencies
        run: mise run frontend:install

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @portaldots/frontend exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @portaldots/frontend exec playwright install-deps chromium

      - name: Generate API client
        run: mise run api:client:codegen

      - name: Build (generates typed-router.d.ts)
        run: pnpm --filter @portaldots/frontend run build

      - name: Test storybook
        run: mise run frontend:test:storybook
