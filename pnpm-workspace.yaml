packages:
  - frontend
  - packages/*
overrides:
  # Advisory fixes for versions pulled in transitively below what their
  # declared parent ranges allow.
  hono: 4.12.34
  '@hono/node-server': 2.0.10
  postcss: 8.5.18
  # Only esbuild 0.18.20 was vulnerable, and it is reached solely through
  # drizzle-kit's deprecated @esbuild-kit/core-utils. Scoping the override
  # there leaves every other consumer, notably vite, on the esbuild it
  # resolves for itself.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  js-yaml: 4.3.0
  brace-expansion: 2.1.3
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@typescript/typescript-aix-ppc64@7.0.2'
  - '@typescript/typescript-darwin-arm64@7.0.2'
  - '@typescript/typescript-darwin-x64@7.0.2'
  - '@typescript/typescript-freebsd-arm64@7.0.2'
  - '@typescript/typescript-freebsd-x64@7.0.2'
  - '@typescript/typescript-linux-arm64@7.0.2'
  - '@typescript/typescript-linux-arm@7.0.2'
  - '@typescript/typescript-linux-loong64@7.0.2'
  - '@typescript/typescript-linux-mips64el@7.0.2'
  - '@typescript/typescript-linux-ppc64@7.0.2'
  - '@typescript/typescript-linux-riscv64@7.0.2'
  - '@typescript/typescript-linux-s390x@7.0.2'
  - '@typescript/typescript-linux-x64@7.0.2'
  - '@typescript/typescript-netbsd-arm64@7.0.2'
  - '@typescript/typescript-netbsd-x64@7.0.2'
  - '@typescript/typescript-openbsd-arm64@7.0.2'
  - '@typescript/typescript-openbsd-x64@7.0.2'
  - '@typescript/typescript-sunos-x64@7.0.2'
  - '@typescript/typescript-win32-arm64@7.0.2'
  - '@typescript/typescript-win32-x64@7.0.2'
  - typescript@7.0.2
  - typescript-native-bridge@6.0.3-bridge.6.tsgo.7.0.2
  - '@typescript-native-bridge/darwin-arm64@6.0.3-bridge.6.tsgo.7.0.2'
  - '@typescript-native-bridge/darwin-x64@6.0.3-bridge.6.tsgo.7.0.2'
  - '@typescript-native-bridge/linux-x64@6.0.3-bridge.6.tsgo.7.0.2'
  - '@typescript-native-bridge/linux-arm64@6.0.3-bridge.6.tsgo.7.0.2'
